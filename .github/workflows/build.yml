name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the zip to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore TangerineWin.csproj

      - name: Publish (self-contained, single file - no .NET install needed)
        run: >
          dotnet publish TangerineWin.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\TangerineWin.exe -DestinationPath TangerineWin-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TangerineWin-win-x64
          path: TangerineWin-win-x64.zip

      - name: Create GitHub Release (only for tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TangerineWin-win-x64.zip
